<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园公共信息与数据展示中心</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部导航：四个入口，窄屏折叠 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#home">校园数据中心</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#home">首页</a></li>
        <li class="nav-item"><a class="nav-link" href="#study-room">自习室</a></li>
        <li class="nav-item"><a class="nav-link" href="#stats">使用统计</a></li>
        <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-4">

  <!-- 首页 Hero -->
  <section id="home" class="py-5">
    <div class="p-5 bg-light rounded-3">
      <h1 class="display-5 fw-bold">迷你版校园公共信息与数据展示中心</h1>
      <p class="lead">整合自习室查询、使用统计与三维导览，把课堂成果组装成一个可访问的综合作品。</p>
      <hr class="my-4">
      <p>下方四个卡片对应本次案例的四个模块，导航栏可在各模块之间快速跳转。</p>
    </div>

    <!-- 模块卡片入口 -->
    <div class="row g-4 mt-2">
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">首页</h5>
            <p class="card-text">Bootstrap 导航与卡片，站点总览与模块入口。</p>
            <a href="#home" class="btn btn-primary">进入</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">自习室查询</h5>
            <p class="card-text">按楼层、开放状态筛选可用自习室。</p>
            <a href="#study-room" class="btn btn-primary">进入</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">使用统计</h5>
            <p class="card-text">各自习室使用量柱状图（ECharts）。</p>
            <a href="#stats" class="btn btn-primary">进入</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">校园三维</h5>
            <p class="card-text">Three.js 校园地标三维导览区。</p>
            <a href="three-d/scene.html" class="btn btn-primary">进入</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 自习室查询区：按楼层 / 开放状态筛选 -->
  <section id="study-room" class="py-5 border-top">
    <h2 class="mb-3">自习室查询</h2>
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <label for="filter-floor" class="form-label">楼层</label>
        <select id="filter-floor" class="form-select">
          <option value="">全部楼层</option>
          <option value="1">1楼</option>
          <option value="2">2楼</option>
          <option value="3">3楼</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="filter-open" class="form-label">开放状态</label>
        <select id="filter-open" class="form-select">
          <option value="">全部</option>
          <option value="true">开放</option>
          <option value="false">关闭</option>
        </select>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <span id="room-count" class="text-muted"></span>
      </div>
    </div>
    <div id="room-list" class="row g-3"></div>
  </section>

  <!-- 使用统计区：ECharts 柱状图 -->
  <section id="stats" class="py-5 border-top">
    <h2 class="mb-3">使用统计</h2>
    <div id="usage-chart" style="height: 420px;"></div>
    <p class="text-muted mt-2" id="chart-source"></p>
  </section>

</main>

<footer class="bg-light py-3 mt-5">
  <div class="container text-center text-muted">
    <small>校园公共信息与数据展示中心 · 复现作业</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="js/study-room.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
