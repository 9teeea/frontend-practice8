<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #three-container { height: 60vh; min-height: 400px; background: #bfe3ff; border-radius: .5rem; overflow: hidden; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="../index.html">校园数据中心</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="../index.html">← 返回首页</a>
    </div>
  </div>
</nav>

<main class="container my-4">
  <h2 class="mb-3">校园三维导览</h2>
  <p class="text-muted">拖动鼠标旋转视角，滚轮缩放。下方为校园主要地标。</p>
  <div id="three-container"></div>

  <!-- 图例 -->
  <div class="row g-2 mt-3 text-center small">
    <div class="col-6 col-md-3"><span class="badge" style="background:#e74c3c">图书馆</span></div>
    <div class="col-6 col-md-3"><span class="badge" style="background:#3498db">教学楼</span></div>
    <div class="col-6 col-md-3"><span class="badge" style="background:#2ecc71">食堂</span></div>
    <div class="col-6 col-md-3"><span class="badge" style="background:#f39c12">体育馆</span></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('three-container');

// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3ff);

// 相机
const camera = new THREE.PerspectiveCamera(
  50, container.clientWidth / container.clientHeight, 0.1, 1000
);
camera.position.set(18, 16, 22);

// 渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// 光照
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshLambertMaterial({ color: 0x90be6d })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 创建立方体建筑工具函数
function addBuilding(x, z, w, h, d, color, label) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshLambertMaterial({ color })
  );
  mesh.position.set(x, h / 2, z);
  scene.add(mesh);
}

// 校园地标布局
addBuilding(-8,  -4,  6, 8,  6, 0xe74c3c); // 图书馆
addBuilding( 6,  -6, 10, 6,  5, 0x3498db); // 教学楼
addBuilding(-6,   8,  5, 4,  5, 0x2ecc71); // 食堂
addBuilding( 8,   6,  7, 7,  4, 0xf39c12); // 体育馆

// 道路（平面）
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 3),
  new THREE.MeshLambertMaterial({ color: 0x888888 })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
scene.add(road);

// 控制器
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 响应式
function onResize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// 渲染循环
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
