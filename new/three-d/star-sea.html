<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星海漫游 · 星瀚科技社</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #three-container { height: 70vh; min-height: 420px; background: #000; border-radius: .5rem; overflow: hidden; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark xh-nav">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="../index.html">
      <span class="xh-logo">✦</span><span class="ms-2">星瀚科技社</span>
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="../index.html">← 返回首页</a>
    </div>
  </div>
</nav>

<main class="container my-4">
  <h2 class="mb-2">🌌 星海漫游</h2>
  <p class="text-muted">拖动鼠标旋转视角，滚轮缩放。星瀚科技社的视觉符号——无垠星海与行星系统。</p>
  <div id="three-container"></div>

  <div class="row g-2 mt-3 text-center small">
    <div class="col-6 col-md-3"><span class="badge" style="background:#ffaa33">恒星·瀚阳</span></div>
    <div class="col-6 col-md-3"><span class="badge" style="background:#2e7dd8">行星·代码星</span></div>
    <div class="col-6 col-md-3"><span class="badge" style="background:#c1440e">行星·数据星</span></div>
    <div class="col-6 col-md-3"><span class="badge" style="background:#e8d5a3">行星·创造星</span></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('three-container');

// 场景：深空背景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x333355, 0.5));

// 星空背景
const starGeo = new THREE.BufferGeometry();
const starCount = 2500;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 220;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, sizeAttenuation: true })));

// 恒星"瀚阳"
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(1.2, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xffaa33 })
);
scene.add(sun);
sun.add(new THREE.PointLight(0xffffff, 1.5, 100));

// 行星系统（命名贴合科技社主题）
const planetData = [
  { name: 'mercury', r: 0.25, color: 0xaaaaaa, orbit: 2.6, speed: 0.04, spin: 0.02 },
  { name: 'code',    r: 0.45, color: 0x2e7dd8, orbit: 4.2, speed: 0.02, spin: 0.03 },
  { name: 'data',    r: 0.35, color: 0xc1440e, orbit: 5.8, speed: 0.013, spin: 0.025 },
  { name: 'create',  r: 0.7,  color: 0xe8d5a3, orbit: 8.0, speed: 0.008, spin: 0.04 }
];

const planets = [];
planetData.forEach(p => {
  const pivot = new THREE.Group();
  scene.add(pivot);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.r, 32, 32),
    new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.8 })
  );
  mesh.position.x = p.orbit;
  pivot.add(mesh);

  // 创造星带环
  if (p.name === 'create') {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(p.r * 1.7, 0.08, 16, 64),
      new THREE.MeshStandardMaterial({ color: 0xd4b896, side: THREE.DoubleSide })
    );
    ring.rotation.x = Math.PI / 2.3;
    mesh.add(ring);
  }

  // 轨道线
  const orbitPts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    orbitPts.push(new THREE.Vector3(Math.cos(a) * p.orbit, 0, Math.sin(a) * p.orbit));
  }
  scene.add(new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(orbitPts),
    new THREE.LineBasicMaterial({ color: 0x444466, transparent: true, opacity: 0.4 })
  ));

  planets.push({ pivot, mesh, speed: p.speed, spin: p.spin });
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

function animate() {
  requestAnimationFrame(animate);
  sun.rotation.y += 0.005;
  const t = performance.now() * 0.001;
  sun.scale.setScalar(1 + Math.sin(t * 2) * 0.03);
  planets.forEach(p => { p.pivot.rotation.y += p.speed; p.mesh.rotation.y += p.spin; });
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
